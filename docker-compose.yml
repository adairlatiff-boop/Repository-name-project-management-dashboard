services:
  backend:
    build: .
    container_name: ippmis-backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: appuser
      DB_PASSWORD: 1234
      DB_NAME: ippmis
      DB_PORT: 5432

  postgres:
    image: postgres:15
    container_name: ippmis-postgres
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ippmis
    ports:
      - "5432:5432"

  frontend:
    build: ./frontend
    container_name: ippmis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend